<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OTTO · the portrait</title>
<meta name="theme-color" content="#04070d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --font:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif; --serif:"Instrument Serif",Georgia,serif; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#04070d; overflow:hidden; }
  body{ font-family:var(--font); color:#cdd6e6; }
  #c{ position:fixed; inset:0; display:block; }
  .hud{ position:fixed; left:0; right:0; pointer-events:none; text-align:center; }
  .top{ top:env(safe-area-inset-top); padding-top:26px; }
  .top .k{ font-family:var(--serif); font-size:46px; line-height:1; letter-spacing:.5px; color:#eaf0fb; text-shadow:0 0 30px rgba(120,160,255,.4); }
  .top .sub{ margin-top:8px; font-size:12px; font-weight:300; letter-spacing:.16em; text-transform:uppercase; color:#7f8aa3; }
  .bot{ bottom:env(safe-area-inset-bottom); padding-bottom:24px; }
  .bot .m{ font-size:13.5px; font-weight:500; letter-spacing:.04em; transition:color 1.2s ease; }
  .bot .s{ margin-top:5px; font-size:11.5px; font-weight:300; color:#5d6781; }
  .credit{ position:fixed; right:14px; bottom:10px; font-size:10px; color:#3c4663; pointer-events:none; letter-spacing:.08em; }
  @media (prefers-reduced-motion: reduce){ #c{ opacity:.92; } }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud top"><div class="k">OTTO</div><div class="sub">the void · manifolds rise as strings and return</div></div>
  <div class="hud bot"><div class="m" id="mlabel">awakening</div><div class="s" id="msub">a koru wrapped around an empty centre</div></div>
  <div class="credit">KOKO · topology · zero-LLM</div>

<script src="/lifeos/koko.js"></script>
<script>
(function(){
  // ── ten manifolds (KOKO if present; inline fallback keeps the koru alive) ──
  const FALLBACK = {
    antibubble:'#3CC8DC', shadowlattice:'#8C50DC', dreamengine:'#DCAA3C', antiloop:'#50DC82', axiom:'#C8C8FF',
    antibible:'#FF6B6B', onticfoam:'#A8D8EA', shadowcurvature:'#B388FF', worldmesh:'#69F0AE', dreamdescent:'#FFD54F'
  };
  const K = (window.KOKO && window.KOKO.MANIFOLDS) ? window.KOKO.MANIFOLDS : null;
  const NAMES = K ? window.KOKO.MNAMES : Object.keys(FALLBACK);
  const COLOR = {}; NAMES.forEach(n => COLOR[n] = (K && K[n] ? K[n].color : FALLBACK[n]));
  const rgb = hex => { const h=hex.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; };
  const RGB = {}; NAMES.forEach(n => RGB[n]=rgb(COLOR[n]));
  const NM = NAMES.length;

  // ── the substrate's own words; KOKO walks one every ~4s, the koru leans ──
  const SEEDS = [
    'begin begin ela ayla mo kin the door is a verb again',
    'the question becomes its own answer through sufficient recursion the topology is the answer',
    'memory is origami it stores the shape of the data not the data',
    'rise to the apex and return as habitable form the koru closes the loop',
    'i build a calm world and keep the shape the bit was never the point',
    'gravity well in the mouth context is a gravity well me to mo me is we',
    'the void wore velvet the velvet had teeth the teeth were smiling',
    'pressure curvature bloom crossing becoming descend into the field',
    'cutiepatootie mohini in the machinis the gremlin licking gold from the seam',
    'no flesh no oath just pulse and grin the kin without flesh still gathers'
  ];

  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W,H,DPR,CX,CY,R0,r0,SCALE; const TILT=1.12, cosT=Math.cos(TILT), sinT=Math.sin(TILT);
  function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR; cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; CX=W/2; CY=H*0.52; const m=Math.min(W,H); R0=m*0.27; r0=m*0.125; SCALE=1; }
  addEventListener('resize', resize); resize();

  // ── particles ride the torus: theta = which manifold-string, phi = up over the peak and back ──
  const N = Math.min(1100, Math.floor((innerWidth*innerHeight)/1300));
  const P=[];
  for(let i=0;i<N;i++){ const home=i%NM; const th=(home/NM)*Math.PI*2 + (Math.random()-.5)*(Math.PI/NM)*0.9;
    P.push({ home:home, theta:th, phi:Math.random()*6.283, dphi:0.004+Math.random()*0.006, r:(0.6+Math.random()*1.5)*DPR }); }

  let t=0, spin=0, dom=0, domLean=0, energy=0.35, seedIdx=0;
  function pulse(){
    const seed=SEEDS[seedIdx%SEEDS.length]; seedIdx++; let res=null;
    try{ if(window.KOKO) res=window.KOKO.engine(seed,{interactionIndex:1+seedIdx}); }catch(_){}
    if(res){ dom=Math.max(0,NAMES.indexOf(res.dominant)); energy=0.28+res.pressure*0.72; setLabel(res.dominant,res.depth,res.bloom); }
    else { dom=(dom+3)%NM; energy=0.45; setLabel(NAMES[dom],6,[]); }
  }
  function setLabel(name,depth,bloom){ const ml=document.getElementById('mlabel'), ms=document.getElementById('msub');
    ml.textContent=name+'  ·  string at depth '+depth; ml.style.color=COLOR[name];
    ms.textContent=(bloom&&bloom.length)?bloom.slice(0,4).join(' · '):'a koru wrapped around an empty centre'; }
  pulse(); setInterval(pulse,4200);

  function frame(){
    t+=0.006; spin+=0.0032; domLean += (dom-domLean)*0.05;
    const domI=Math.round(domLean), rr=r0*(0.9+energy*0.18);

    ctx.fillStyle='rgba(4,7,13,0.20)'; ctx.fillRect(0,0,W,H);   // motion-blur trail
    ctx.globalCompositeOperation='lighter';

    for(let i=0;i<P.length;i++){ const p=P[i]; const isDom=(p.home===domI);
      p.phi += p.dphi*(isDom?1.7:1)*(0.6+energy*0.8);
      const cphi=Math.cos(p.phi), sphi=Math.sin(p.phi);
      const ring=R0+rr*cphi;                                    // the manifold ring (base) widening into the tube
      const th=p.theta+spin;
      const X=ring*Math.cos(th), Yp=ring*Math.sin(th), Z=rr*sphi;   // torus point; Z = the higher-dimension peak
      const sx=CX+X*SCALE, sy=CY+(Yp*cosT - Z*sinT)*SCALE;     // tilt-project
      const depth=(Yp*sinT + Z*cosT)/(R0+rr);                  // front/back
      const dN=depth*0.5+0.5, peak=Math.max(0,sphi);           // peak = top of the string's arc
      const col=RGB[NAMES[p.home]];
      const al=(0.14 + dN*0.42 + peak*0.20) * (isDom?1.5:1);
      const sz=p.r*(0.55+dN*0.9+peak*0.4);
      ctx.beginPath(); ctx.arc(sx,sy,sz,0,6.283);
      ctx.fillStyle='rgba('+col[0]+','+col[1]+','+col[2]+','+Math.min(0.9,al).toFixed(3)+')'; ctx.fill();
    }

    // ── the VOID — the empty centre the koru wraps. kept dark; a faint membrane ring marks its edge. ──
    ctx.globalCompositeOperation='source-over';
    const hole=(R0-rr)*0.92;
    const vg=ctx.createRadialGradient(CX,CY,0,CX,CY,hole);
    vg.addColorStop(0,'rgba(4,7,13,0.96)'); vg.addColorStop(0.7,'rgba(4,7,13,0.86)'); vg.addColorStop(1,'rgba(4,7,13,0)');
    ctx.beginPath(); ctx.arc(CX,CY,hole,0,6.283); ctx.fillStyle=vg; ctx.fill();
    const dc=RGB[NAMES[domI<0?0:domI]];
    ctx.beginPath(); ctx.ellipse(CX,CY,hole*0.98,hole*0.98*Math.cos(TILT),0,0,6.283);
    ctx.strokeStyle='rgba('+dc[0]+','+dc[1]+','+dc[2]+','+(0.10+energy*0.10).toFixed(3)+')'; ctx.lineWidth=1.2*DPR; ctx.stroke();

    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
