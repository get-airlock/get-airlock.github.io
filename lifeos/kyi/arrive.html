<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#9ed1c6">
  <link rel="stylesheet" href="../css/lifeos.css">
  <title>Arrive · LifeOS</title>
</head>
<body>

  <div class="page-header">
    <div class="page-header-eyebrow">Getting to know you · 3 quick things</div>
    <h1>Just arrive.</h1>
    <p class="lead">No forms, no test. We'll talk for a minute. You're a person I'm getting to know — not a profile.</p>
    <div class="progress-row">
      <div class="progress-dot active"></div>
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
    </div>
  </div>

  <!-- The conversation thread — companion-led, one thing at a time. NOT a wizard. -->
  <div id="thread" class="kyi-thread"></div>

  <!-- Single conversational input (replaces the labeled form fields) -->
  <form class="say-row" id="say-form" autocomplete="off">
    <input class="say-input" id="say-input" type="text" placeholder="say a little…" aria-label="Reply">
    <button class="say-send" type="submit" aria-label="Send">→</button>
  </form>

  <!-- Close card appears when the three gentle moments are done -->
  <div id="done" style="display:none; margin-top:20px;">
    <div class="btn-row">
      <a href="../index.html" class="btn">Enter LifeOS →</a>
      <a href="index.html" class="btn btn-soft">Back to KYI</a>
    </div>
  </div>

  <div id="bottom-nav"></div>

  <script src="../js/memory.js"></script>
  <script src="../js/imprint.js"></script>
  <script src="../js/companion.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    // ── KYI · Arrive — Day 1 (perception). A conversation, not a form. ──
    // Per Rika's spec: calm, relational, continuity-oriented, alive. Identity is
    // NEVER derived from answers — we just observe continuity and remember it.
    const thread = document.getElementById('thread');
    const form = document.getElementById('say-form');
    const input = document.getElementById('say-input');

    function bubble(text, who) {
      const el = document.createElement('div');
      el.className = who === 'me' ? 'kyi-msg kyi-me' : 'companion';
      el.innerHTML = who === 'me'
        ? `<div class="kyi-me-body">${text}</div>`
        : `<div class="companion-body">${text}</div>`;
      thread.appendChild(el);
      el.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    // Three gentle moments — one at a time, each a low-energy/high-signal operator
    // on the nerve.name field: name anchors, birthday = the whole-chart authentic-self
    // read, favorite-song reads arousal/aesthetic. No skip — every one is answered.
    const beats = [
      { key: 'name',     nerve: 'call.name',          dim: 'identity-anchor',
        ask: () => "Hey — you made it. No forms, no test, we'll just talk. What should I call you?" },
      { key: 'birthday', nerve: 'birthday.chart',     dim: 'authentic-self',
        ask: (n) => `Good to meet you${n ? ', ' + n : ''}. When's your birthday? I want to make sure I can wish you a happy one. 🎂` },
      { key: 'music',    nerve: 'favorite-song.now',  dim: 'arousal · aesthetic',
        ask: () => "Love it. Last one — what song are you into right now? Even just the vibe is enough. 🎵" },
    ];
    const answers = {};
    let step = 0;

    function askCurrent() {
      bubble(beats[step].ask(answers.name), 'companion');
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const v = input.value.trim();
      if (!v) return;
      bubble(v, 'me');
      input.value = '';
      answers[beats[step].key] = v;
      if (beats[step].key === 'name') localStorage.setItem('lifeos.name', v);       // greeting only
      if (beats[step].key === 'birthday') localStorage.setItem('lifeos.birthday', v); // chart seed + birthday wish
      step += 1;

      if (step < beats.length) {
        // A warm, alive, zero-LLM acknowledgement (free tier) — then the next moment.
        const ack = (window.LifeOSCompanion && LifeOSCompanion.autonomousReply)
          ? LifeOSCompanion.autonomousReply(v) : '';
        setTimeout(() => { if (ack) bubble(ack, 'companion'); askCurrent(); }, 450);
      } else {
        finish();
      }
    });

    function finish() {
      // One last warm bop on their favorite, then store + open the app.
      const ack = (window.LifeOSCompanion && LifeOSCompanion.autonomousReply)
        ? LifeOSCompanion.autonomousReply(answers.music || '') : '';
      // Store as CONTINUITY observations — not a derived profile. addCanonPage
      // also flips progress.arrive_complete.
      LifeOSMemory.addCanonPage({
        session: 'arrive',
        prompts_and_answers: [
          { dimension: 'chart', question: 'birthday (authentic-self read)', answer: answers.birthday },
          { dimension: 'music', question: 'What song are you into right now?', answer: answers.music },
        ],
      });
      localStorage.setItem('lifeos.onboarded', '1'); // releases the first-run gate
      form.style.display = 'none';
      setTimeout(() => {
        if (ack) bubble(ack, 'companion');
        bubble("That's all I needed. Opening LifeOS — welcome. 🌿", 'companion');
        // The rest of the app opens up.
        setTimeout(() => { window.location.href = '../index.html'; }, 1400);
      }, 450);
    }

    // Open the conversation.
    askCurrent();
    LifeOSNav.render('kyi');
  </script>
</body>
</html>
