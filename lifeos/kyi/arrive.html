<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#9ed1c6">
  <link rel="stylesheet" href="../css/lifeos.css">
  <title>Arrive · LifeOS</title>
</head>
<body>

  <div class="page-header">
    <div class="page-header-eyebrow">KYI · Arrive (day 1 of 3)</div>
    <h1>Just arrive.</h1>
    <p class="lead">No forms, no test. We'll talk for a minute. You're a person I'm getting to know — not a profile.</p>
    <div class="progress-row">
      <div class="progress-dot active"></div>
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
    </div>
  </div>

  <!-- The conversation thread — companion-led, one thing at a time. NOT a wizard. -->
  <div id="thread" class="kyi-thread"></div>

  <!-- Single conversational input (replaces the labeled form fields) -->
  <form class="say-row" id="say-form" autocomplete="off">
    <input class="say-input" id="say-input" type="text" placeholder="say a little…" aria-label="Reply">
    <button class="say-send" type="submit" aria-label="Send">→</button>
  </form>

  <!-- Close card appears when the three gentle moments are done -->
  <div id="done" style="display:none; margin-top:20px;">
    <div class="btn-row">
      <a href="../index.html" class="btn">Enter LifeOS →</a>
      <a href="index.html" class="btn btn-soft">Back to KYI</a>
    </div>
  </div>

  <div id="bottom-nav"></div>

  <script src="../js/memory.js"></script>
  <script src="../js/imprint.js"></script>
  <script src="../js/companion.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    // ── KYI · Arrive — Day 1 (perception). A conversation, not a form. ──
    // Per Rika's spec: calm, relational, continuity-oriented, alive. Identity is
    // NEVER derived from answers — we just observe continuity and remember it.
    const thread = document.getElementById('thread');
    const form = document.getElementById('say-form');
    const input = document.getElementById('say-input');

    function bubble(text, who) {
      const el = document.createElement('div');
      el.className = who === 'me' ? 'kyi-msg kyi-me' : 'companion';
      el.innerHTML = who === 'me'
        ? `<div class="kyi-me-body">${text}</div>`
        : `<div class="companion-body">${text}</div>`;
      thread.appendChild(el);
      el.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    // Three gentle moments — asked conversationally, one at a time.
    const beats = [
      { key: 'name',  ask: () => "You made it. No forms, no test — let's just talk for a sec. What should I call you?" },
      { key: 'music', ask: (n) => `Good to meet you${n ? ', ' + n : ''}. What song are you into right now? Even just the vibe is enough. 🎵` },
      { key: 'body',  ask: () => "Love that. Last one for today — what would feel good right now: quiet, playful, focused, or reflective?" },
    ];
    const answers = {};
    let step = 0;

    function askCurrent() {
      bubble(beats[step].ask(answers.name), 'companion');
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const v = input.value.trim();
      if (!v) return;
      bubble(v, 'me');
      input.value = '';
      answers[beats[step].key] = v;
      if (beats[step].key === 'name') localStorage.setItem('lifeos.name', v); // for greeting only
      step += 1;

      if (step < beats.length) {
        // A warm, alive, zero-LLM acknowledgement (free tier) — then the next moment.
        const ack = (window.LifeOSCompanion && LifeOSCompanion.autonomousReply)
          ? LifeOSCompanion.autonomousReply(v) : '';
        setTimeout(() => { if (ack) bubble(ack, 'companion'); askCurrent(); }, 450);
      } else {
        finish();
      }
    });

    function finish() {
      // Store as CONTINUITY observations — not a derived profile. addCanonPage
      // also flips progress.arrive_complete, unlocking Continue (gradual unlock).
      LifeOSMemory.addCanonPage({
        session: 'arrive',
        prompts_and_answers: [
          { dimension: 'music', question: 'What song are you into right now?', answer: answers.music || '(skipped)' },
          { dimension: 'body',  question: 'What kind of support would feel good right now?', answer: answers.body || '(skipped)' },
        ],
      });
      localStorage.setItem('lifeos.onboarded', '1'); // releases the first-run gate
      const close = (window.LifeOSCompanion && LifeOSCompanion.respondAfterKYI)
        ? LifeOSCompanion.respondAfterKYI('arrive')
        : "That's all for today. I'll remember this, and we'll pick up tomorrow.";
      setTimeout(() => {
        bubble(close, 'companion');
        bubble("Nothing's locked in. You're not a profile — you're someone I'm starting to know.", 'companion');
        form.style.display = 'none';
        document.getElementById('done').style.display = 'block';
        const nav = document.querySelector('.bottom-nav'); if (nav) nav.remove();
        LifeOSNav.render('kyi');
      }, 500);
    }

    // Open the conversation.
    askCurrent();
    LifeOSNav.render('kyi');
  </script>
</body>
</html>
