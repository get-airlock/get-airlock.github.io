<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#9ed1c6">
  <link rel="stylesheet" href="../css/lifeos.css">
  <title>Continue · LifeOS</title>
</head>
<body>

  <div class="page-header">
    <div class="page-header-eyebrow">KYI · Continue (day 2 of 3)</div>
    <h1>Good to see you again.</h1>
    <p class="lead">No right answers. A couple of in-the-moment things — only if you want.</p>
    <div class="progress-row">
      <div class="progress-dot done"></div>
      <div class="progress-dot active"></div>
      <div class="progress-dot"></div>
    </div>
  </div>

  <div id="thread" class="kyi-thread"></div>

  <form class="say-row" id="say-form" autocomplete="off">
    <input class="say-input" id="say-input" type="text" placeholder="say a little…" aria-label="Reply">
    <button class="say-send" type="submit" aria-label="Send">→</button>
  </form>

  <div id="done" style="display:none; margin-top:20px;">
    <div class="btn-row">
      <a href="contribute.html" class="btn">One more day →</a>
      <a href="../index.html" class="btn btn-soft">Enter LifeOS</a>
    </div>
  </div>

  <div id="bottom-nav"></div>

  <script src="../js/memory.js"></script>
  <script src="../js/imprint.js"></script>
  <script src="../js/companion.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    // ── KYI · Continue — Day 2 (relationships / reflection). Point, don't rank. ──
    if (!LifeOSMemory.load().progress.arrive_complete) { window.location.href = 'arrive.html'; }
    const thread = document.getElementById('thread');
    const form = document.getElementById('say-form');
    const input = document.getElementById('say-input');
    const name = localStorage.getItem('lifeos.name') || '';

    function bubble(text, who) {
      const el = document.createElement('div');
      el.className = who === 'me' ? 'kyi-msg kyi-me' : 'companion';
      el.innerHTML = who === 'me' ? `<div class="kyi-me-body">${text}</div>` : `<div class="companion-body">${text}</div>`;
      thread.appendChild(el);
      el.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    // In-the-moment, concrete, escapable — not "who matters to you" (an absolute a kid can't answer).
    const beats = [
      { key: 'smile', ask: () => `Hey${name ? ', ' + name : ''} — welcome back. Who made you smile today?` },
      { key: 'carry', ask: () => "Love that. Anything you want me to remember for next time? Totally okay to say 'nah' — no pressure." },
    ];
    const answers = {};
    let step = 0;
    function askCurrent() { bubble(beats[step].ask(), 'companion'); }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const v = input.value.trim();
      if (!v) return;
      bubble(v, 'me'); input.value = '';
      answers[beats[step].key] = v;
      step += 1;
      if (step < beats.length) {
        const ack = (window.LifeOSCompanion && LifeOSCompanion.autonomousReply) ? LifeOSCompanion.autonomousReply(v) : '';
        setTimeout(() => { if (ack) bubble(ack, 'companion'); askCurrent(); }, 450);
      } else { finish(); }
    });

    function finish() {
      LifeOSMemory.addCanonPage({
        session: 'continue',
        prompts_and_answers: [
          { dimension: 'relationships', question: 'Who made you smile today?', answer: answers.smile || '(skipped)' },
          { dimension: 'carry-forward', question: 'Anything to remember for next time?', answer: answers.carry || '(skipped)' },
        ],
      });
      const close = (window.LifeOSCompanion && LifeOSCompanion.respondAfterKYI)
        ? LifeOSCompanion.respondAfterKYI('continue') : "I'll hold onto that. See you tomorrow.";
      setTimeout(() => {
        bubble(close, 'companion');
        form.style.display = 'none';
        document.getElementById('done').style.display = 'block';
        const nav = document.querySelector('.bottom-nav'); if (nav) nav.remove();
        LifeOSNav.render('kyi');
      }, 500);
    }

    askCurrent();
    LifeOSNav.render('kyi');
  </script>
</body>
</html>
