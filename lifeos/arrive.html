<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="theme-color" content="#eaf2ef">
<title>LifeOS — Arrive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/lifeos.css">
<style>
  /* ── orb (from the new home mock, verbatim look) ── */
  .arrive-main{ display:flex; flex-direction:column; align-items:center; padding:8px 20px 40px; }
  .greet-block{ text-align:center; margin:24px 0 6px; }
  .greet{ font-family:var(--font-display); font-weight:400; font-size:clamp(34px,11vw,48px); line-height:1.0; color:var(--ink-strong); }
  .greet .name{ font-style:italic; color:var(--accent-deep); }
  .greet-sub{ margin-top:10px; font-size:15px; color:var(--ink-soft); max-width:30ch; margin-left:auto; margin-right:auto; }

  .orb-stage{ position:relative; width:100%; aspect-ratio:1; max-width:300px; margin:10px auto 4px; display:grid; place-items:center; }
  .orb-halo{ position:absolute; width:86%; height:86%; border-radius:50%; filter:blur(30px); opacity:0.85;
    background:radial-gradient(circle at 50% 45%, var(--teal), var(--lav) 55%, transparent 72%); animation:halo 7s ease-in-out infinite; }
  @keyframes halo{ 0%,100%{ transform:scale(1); opacity:0.7 } 50%{ transform:scale(1.1); opacity:0.95 } }
  .orb-ring{ position:absolute; width:100%; height:100%; }
  .orb{ position:relative; width:60%; height:60%; border-radius:50%; overflow:hidden; cursor:pointer;
    background:radial-gradient(circle at 34% 28%, rgba(255,255,255,0.95), rgba(255,255,255,0.25) 30%, rgba(255,255,255,0.04) 55%);
    box-shadow:inset 0 4px 14px rgba(255,255,255,0.9), inset 0 -22px 40px -10px rgba(60,120,110,0.35), inset 0 0 0 1px rgba(255,255,255,0.4), 0 24px 48px -16px rgba(50,110,100,0.5);
    backdrop-filter:blur(2px); animation:breathe 6s ease-in-out infinite; transition:transform .5s cubic-bezier(.2,.8,.2,1); z-index:2; }
  @keyframes breathe{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.035) } }
  .orb-fluid{ position:absolute; inset:-25%; z-index:-1; }
  .orb-fluid span{ position:absolute; width:70%; height:70%; border-radius:50%; filter:blur(14px); opacity:0.85; }
  .orb-fluid .f1{ left:4%; top:6%; background:radial-gradient(circle,var(--teal),transparent 68%); animation:swirl 9s ease-in-out infinite; }
  .orb-fluid .f2{ right:2%; top:18%; background:radial-gradient(circle,var(--lav),transparent 68%); animation:swirl 11s ease-in-out infinite reverse; }
  .orb-fluid .f3{ left:20%; bottom:2%; background:radial-gradient(circle,var(--peach),transparent 66%); animation:swirl 13s ease-in-out infinite; }
  .orb-fluid .f4{ right:14%; bottom:14%; background:radial-gradient(circle,var(--sky),transparent 66%); animation:swirl 10s ease-in-out infinite reverse; }
  @keyframes swirl{ 0%,100%{ transform:translate(0,0) scale(1) } 33%{ transform:translate(16%,10%) scale(1.12) } 66%{ transform:translate(-12%,14%) scale(0.92) } }
  .orb-spec{ position:absolute; left:24%; top:16%; width:34%; height:26%; border-radius:50%; background:radial-gradient(circle at 40% 40%, rgba(255,255,255,0.95), transparent 70%); filter:blur(2px); z-index:1; }
  .orb-tap{ position:absolute; inset:0; width:100%; height:100%; border:0; background:transparent; cursor:pointer; z-index:3; border-radius:50%; }
  .orb-stage.listening .orb{ animation:breathe 2.6s ease-in-out infinite; box-shadow:inset 0 4px 14px rgba(255,255,255,0.9), inset 0 -22px 44px -8px rgba(60,140,125,0.45), inset 0 0 0 1px rgba(255,255,255,0.5), 0 28px 60px -14px rgba(50,140,120,0.6); }
  .orb-stage.listening .orb-halo{ animation-duration:2.6s; }
  .orb-stage.speaking .orb{ animation:breathe 1.7s ease-in-out infinite; }
  .orb-stage.thinking .orb{ animation:breathe 3.4s ease-in-out infinite; opacity:0.94; }

  .status{ display:inline-flex; align-items:center; gap:8px; margin:4px auto 0; padding:8px 16px; border-radius:999px;
    background:var(--glass); border:1px solid var(--glass-line); backdrop-filter:blur(12px); box-shadow:var(--shadow-soft); font-size:13.5px; color:var(--ink); font-weight:500; }
  .status .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); animation:ping 1.6s ease-out infinite; }
  @keyframes ping{ 0%{ box-shadow:0 0 0 0 rgba(95,182,166,0.55) } 100%{ box-shadow:0 0 0 9px rgba(95,182,166,0) } }

  .convo{ display:flex; flex-direction:column; gap:12px; margin-top:18px; width:100%; max-width:440px; }
  .transcript,.reply{ opacity:0; transform:translateY(8px); transition:opacity .4s, transform .4s; }
  .transcript[hidden],.reply[hidden]{ display:none; }
  .transcript.show,.reply.show{ opacity:1; transform:none; }
  .transcript{ align-self:flex-end; max-width:86%; padding:12px 16px; border-radius:20px 20px 6px 20px; background:linear-gradient(180deg,rgba(255,255,255,0.85),rgba(255,255,255,0.6)); border:1px solid var(--glass-line); color:var(--ink-strong); font-size:15px; line-height:1.45; box-shadow:var(--shadow-soft); font-style:italic; }
  .reply{ align-self:flex-start; max-width:90%; padding:16px 18px; border-radius:20px 20px 20px 6px; background:var(--glass-strong); border:1px solid var(--glass-line); backdrop-filter:blur(16px) saturate(1.2); box-shadow:var(--shadow-lift); color:var(--ink-strong); font-size:15.5px; line-height:1.55; }
  .reply .who{ display:flex; align-items:center; gap:8px; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; color:var(--accent-deep); font-weight:700; margin-bottom:7px; }
  .reply .who .av{ width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 35% 30%,var(--teal),var(--lav)); }

  .say-row{ display:flex; align-items:center; gap:10px; margin-top:18px; padding:6px 6px 6px 18px; width:100%; max-width:440px; border-radius:999px; background:var(--glass); border:1px solid var(--glass-line); backdrop-filter:blur(14px); box-shadow:var(--shadow-soft); }
  .say-row:focus-within{ box-shadow:var(--shadow-lift); border-color:rgba(95,182,166,0.45); }
  .say-input{ flex:1; border:0; background:transparent; font-family:var(--font-body); font-size:16px; color:var(--ink-strong); outline:none; }
  .say-input::placeholder{ color:var(--ink-faint); }
  .say-date{ flex:1; border:0; background:transparent; font-family:var(--font-body); font-size:16px; color:var(--ink-strong); outline:none; }
  .say-send{ width:42px; height:42px; flex-shrink:0; border:0; border-radius:50%; cursor:pointer; display:grid; place-items:center; color:#fff; background:linear-gradient(150deg,var(--accent),var(--accent-deep)); box-shadow:0 6px 16px -4px rgba(60,140,120,0.6); transition:transform .25s; }
  .say-send:active{ transform:scale(0.9); }
  .say-send svg{ width:18px; height:18px; }

  .progress-dots{ display:flex; gap:8px; justify-content:center; margin-top:22px; }
  .progress-dots i{ width:7px; height:7px; border-radius:50%; background:var(--glass-line); transition:background .3s, transform .3s; }
  .progress-dots i.done{ background:var(--accent); }
  .progress-dots i.active{ background:var(--accent-deep); transform:scale(1.3); }
  .demo-banner{ margin-top:26px; font-size:12px; color:var(--ink-faint); text-align:center; }
</style>
</head>
<body>
  <div class="shell">
    <main class="arrive-main">
      <div class="greet-block">
        <h1 class="greet">Just <span class="name">arrive</span>.</h1>
        <p class="greet-sub">No forms, no test. We’ll just talk — you’re a person I’m getting to know, not a profile.</p>
      </div>

      <div class="orb-stage" id="stage">
        <div class="orb-halo"></div>
        <canvas class="orb-ring" id="ring" width="600" height="600"></canvas>
        <div class="orb">
          <div class="orb-fluid"><span class="f1"></span><span class="f2"></span><span class="f3"></span><span class="f4"></span></div>
          <div class="orb-spec"></div>
          <button class="orb-tap" id="tap" aria-label="Tap to talk"></button>
        </div>
      </div>

      <div style="text-align:center;">
        <div class="status"><span class="dot"></span><span id="status-text">Tap the orb and just talk — or type</span></div>
      </div>

      <div class="convo">
        <p class="transcript" id="transcript" hidden></p>
        <div class="reply" id="reply" hidden>
          <div class="who"><span class="av"></span> Carrie</div>
          <div id="reply-body"></div>
        </div>
      </div>

      <form class="say-row" id="say-form" autocomplete="off">
        <input class="say-input" id="say-input" type="text" placeholder="…or type to talk" aria-label="Type a message">
        <input class="say-date" id="say-date" type="date" hidden aria-label="Your birthday">
        <button class="say-send" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </button>
      </form>

      <div class="progress-dots" id="dots"><i></i><i></i><i></i></div>
      <p class="demo-banner">Mock demo · No accounts · Memory stays on this device · Carrie speaks with a real voice</p>
    </main>
  </div>

  <script src="js/store.js"></script>
  <script>
  (function(){
    'use strict';
    // ── backend: shuttle (public) for chat + voice; relay override for the sovereign path ──
    var SHUTTLE = 'https://lifeos-shuttle.vercel.app';
    // local preview auto-uses the relay brain; deployed (airlocklabs.io) uses the shuttle
    var _localPreview = /^(localhost|127\.|192\.168\.)/.test(location.hostname);
    var RELAY = (window.LIFEOS_RELAY || (_localPreview ? 'http://127.0.0.1:8200' : '')).replace(/\/$/, '');
    var COMPANION = 'carrie';

    // ── elements ──
    var stage=document.getElementById('stage'), statusText=document.getElementById('status-text'),
        transcript=document.getElementById('transcript'), reply=document.getElementById('reply'),
        replyBody=document.getElementById('reply-body'), tap=document.getElementById('tap'),
        form=document.getElementById('say-form'), input=document.getElementById('say-input'),
        dateInput=document.getElementById('say-date'), dots=document.getElementById('dots').children,
        canvas=document.getElementById('ring'), ctx=canvas.getContext('2d');

    // ── reactive ring (from the mock) ──
    var DPR=Math.min(window.devicePixelRatio||1,2);
    function sizeCanvas(){ var s=stage.clientWidth; canvas.width=s*DPR; canvas.height=s*DPR; canvas.style.width=s+'px'; canvas.style.height=s+'px'; }
    sizeCanvas(); window.addEventListener('resize', sizeCanvas);
    var BARS=72, phase=Array.from({length:BARS},function(_,i){return i*0.5;}), amp=0.12, ampTarget=0.12, tt=0;
    function draw(){ tt+=0.016; amp+=(ampTarget-amp)*0.08; var w=canvas.width,h=canvas.height,cx=w/2,cy=h/2; ctx.clearRect(0,0,w,h);
      var base=w*0.345, maxLen=w*0.085;
      for(var i=0;i<BARS;i++){ var a=(i/BARS)*Math.PI*2-Math.PI/2; var n=Math.sin(tt*1.6+phase[i])*0.5+Math.sin(tt*0.9+phase[i]*1.7)*0.5;
        var len=maxLen*(0.18+(n*0.5+0.5)*amp*1.4); var x1=cx+Math.cos(a)*base, y1=cy+Math.sin(a)*base, x2=cx+Math.cos(a)*(base+len), y2=cy+Math.sin(a)*(base+len);
        var hue=178+Math.sin(tt*0.5+i*0.12)*60; ctx.strokeStyle='oklch(0.72 0.09 '+hue+' / '+(0.35+amp*0.5)+')'; ctx.lineWidth=w*0.008; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
      requestAnimationFrame(draw); }
    draw();

    function setState(s){ stage.classList.remove('listening','thinking','speaking'); if(s!=='idle') stage.classList.add(s);
      statusText.textContent = ({idle:'Tap the orb and just talk — or type',listening:"I'm listening…",thinking:'Thinking…',speaking:'Carrie is speaking…'})[s];
      ampTarget = s==='listening'?0.85 : s==='speaking'?0.6 : s==='thinking'?0.3 : 0.12; }
    function showEl(el){ el.hidden=false; void el.offsetWidth; el.classList.add('show'); }
    function hideEl(el){ el.classList.remove('show'); setTimeout(function(){ if(!el.classList.contains('show')) el.hidden=true; },460); }
    function setDots(active, done){ for(var i=0;i<dots.length;i++){ dots[i].className=''; if(i<done) dots[i].classList.add('done'); else if(i===active) dots[i].classList.add('active'); } }

    // ── real brain (shuttle /api/chat, or relay /lifeos/chat) ──
    var history=[];
    function brainReply(userText){
      var outgoing = history.slice(-8).concat([{role:'user',content:userText}]);
      var body = JSON.stringify({ messages:outgoing, memory:'', companion:COMPANION, assist:false });
      function viaRelay(){ return fetch(RELAY+'/lifeos/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:body})
        .then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(d){ return d&&d.reply; }); }
      function viaShuttle(){ return fetch(SHUTTLE+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:body})
        .then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(d){ return d&&d.reply; }); }
      var chain = RELAY ? viaRelay().catch(viaShuttle) : viaShuttle();
      return chain.then(function(rep){ rep = rep || "I'm here with you."; history.push({role:'user',content:userText},{role:'assistant',content:rep}); return rep; })
                  .catch(function(){ return "I'm here with you."; });
    }

    // ── real voice out (shuttle /api/tts) ──
    var audio=null;
    function speak(text){ return new Promise(function(res){
      try{
        fetch(SHUTTLE+'/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text})})
          .then(function(r){ if(!r.ok) throw 0; return r.blob(); })
          .then(function(b){ var url=URL.createObjectURL(b); if(audio){audio.pause();} audio=new Audio(url); setState('speaking');
            audio.onended=function(){ URL.revokeObjectURL(url); res(); }; audio.onerror=function(){ res(); }; audio.play().catch(function(){res();}); })
          .catch(function(){ res(); });
      }catch(e){ res(); }
    }); }

    // ── voice in (browser STT; falls back to typing) ──
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    function listen(){ return new Promise(function(res,rej){
      if(!SR){ statusText.textContent='Type to talk — voice needs Safari or Chrome'; rej('no-stt'); return; }
      var rec=new SR(); rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=1; setState('listening');
      rec.onresult=function(e){ res(e.results[0][0].transcript); };
      rec.onerror=function(){ setState('idle'); rej('stt-err'); };
      rec.onend=function(){ if(stage.classList.contains('listening')) setState('idle'); };
      try{ rec.start(); }catch(_){ rej('stt-start'); }
    }); }

    // ── the 3-question onboarding flow (no loop) ──
    var beats = [
      { key:'name',     ask:"Hi — I'm Carrie. Before we begin: what should I call you?", type:'text' },
      { key:'birthday', ask:"Lovely to meet you, {name}. When's your birthday, so I can remember?", type:'date' },
      { key:'motion',   ask:"Thank you. Last thing — how are you feeling, right now, in this moment?", type:'text' },
    ];
    var step=0, answers={}, busy=false;

    function askCurrent(){
      var b=beats[step]; setDots(step,step);
      var q=b.ask.replace('{name}', answers.name||'friend');
      // birthday → show the date picker instead of text
      input.hidden = (b.type==='date'); dateInput.hidden = (b.type!=='date');
      (b.type==='date'?dateInput:input).focus();
      hideEl(reply); setState('thinking');
      replyBody.textContent=q; showEl(reply);
      speak(q).then(function(){ setState('idle'); });
    }

    function handleAnswer(v){
      if(busy||!v) return; busy=true;
      var b=beats[step];
      transcript.textContent = (b.type==='date' ? 'My birthday: '+v : '“'+v+'”'); showEl(transcript);
      setState('thinking');

      // Carrie responds to anything, but keeps collecting the answer. The name beat
      // EXTRACTS just the name (so "my name is Zach" → Zach) and re-asks if they went off-script.
      var prompt;
      if(b.key==='name'){
        prompt = 'You are Carrie, warmly onboarding someone. You just asked what to call them. They replied: "'+v+'". '
          + 'If they gave a name (even inside a sentence like "my name is Zach" or "call me Z"), greet them warmly BY THAT NAME in one short sentence, '
          + 'then on a NEW LINE output exactly: NAME=<just the name>. '
          + 'If they did NOT give a name (they asked something or went off-topic), answer them warmly in one short sentence, gently ask again what you should call them, '
          + 'then on a new line output exactly: NAME=NONE. Always include the NAME= line.';
      } else if(b.key==='motion'){
        prompt = 'You are Carrie. The person shared how they feel right now: "'+v+'". Reply in ONE warm sentence acknowledging the feeling, then say you have what you need and welcome them in. No questions.';
      } else {
        prompt = 'You are Carrie. The person gave their birthday: '+v+'. Reply in ONE short warm sentence (note the season, or that you will remember). No questions.';
      }

      brainReply(prompt).then(function(rep){
        var captured = v, retry = false;
        if(b.key==='name'){
          var m = rep.match(/NAME\s*=\s*(.+)/i);
          var nm = m ? m[1].trim().replace(/[."'\s]+$/,'') : '';
          if(!nm || /^none$/i.test(nm)){ retry = true; } else { captured = nm; }
          rep = rep.replace(/NAME\s*=.*/i,'').trim();   // never show the marker
        }
        hideEl(reply); setTimeout(function(){ replyBody.textContent=rep; showEl(reply); }, 220);
        return speak(rep).then(function(){ return { captured: captured, retry: retry }; });
      }).then(function(r){
        setState('idle'); busy=false;
        if(r.retry){ // stay on this question — let them answer again
          input.hidden=false; dateInput.hidden=true; input.focus(); return;
        }
        answers[b.key] = r.captured;
        if(b.key==='name'){ try{ localStorage.setItem('lifeos.name', r.captured); }catch(e){} }
        if(b.key==='birthday'){ try{ localStorage.setItem('lifeos.birthday', r.captured); }catch(e){} }
        step+=1;
        if(step<beats.length){ setTimeout(askCurrent, 500); }
        else { finish(); }
      });
    }

    function finish(){
      setDots(-1, beats.length);
      try{
        localStorage.setItem('lifeos.onboarded','1');
        if(window.LifeOSStore && LifeOSStore.load){ var st=LifeOSStore.load(); st.name=answers.name||st.name; LifeOSStore.save&&LifeOSStore.save(st); }
      }catch(e){}
      var bye="That’s all I needed. Welcome to LifeOS, "+(answers.name||'friend')+". 🌿";
      hideEl(reply); setTimeout(function(){ replyBody.textContent=bye; showEl(reply); },220);
      speak(bye).then(function(){ setTimeout(function(){ window.location.replace('home.html'); }, 900); });
      // hard stop so it never re-loops the questions
      form.style.display='none';
    }

    // ── inputs ──
    tap.addEventListener('click', function(){
      if(busy) return;
      var b=beats[step];
      if(b.type==='date'){ dateInput.focus(); return; }   // can't speak a date
      listen().then(handleAnswer).catch(function(){ input.focus(); });
    });
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var b=beats[step];
      var v = b.type==='date' ? dateInput.value : input.value.trim();
      if(!v) return; input.value='';
      handleAnswer(v);
    });

    // ── start (after a tap-to-allow-audio gesture, browsers need a user gesture for autoplay;
    //     we kick the first question on first interaction OR immediately try, falling back gracefully) ──
    function begin(){ document.removeEventListener('click', begin); askCurrent(); }
    // try immediately; if autoplay is blocked the text still shows and voice resumes on first tap
    askCurrent();
    document.addEventListener('click', function once(){ document.removeEventListener('click', once); if(audio&&audio.paused){ audio.play().catch(function(){}); } });
  })();
  </script>
</body>
</html>
